<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>VaniFlight Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Dokumentasi teknis resmi VaniFlight: Flight Controller open-source untuk Flying Wing, Plank, dan Tailsitter VTOL berbasis RP2040-Zero.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #0284c7;
    }
    .app-nav {
      position: fixed;
      margin: 0;
      padding: 12px 28px;
      right: 0;
      top: 0;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(6px);
      border-bottom-left-radius: 8px;
      z-index: 30;
    }
    .app-nav a.configurator-cta {
      background: #0284c7;
      color: #ffffff !important;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 600;
      text-decoration: none;
    }
    .app-nav a.configurator-cta:hover {
      background: #0369a1;
    }
    .markdown-section table {
      display: table;
      width: 100%;
    }
    .markdown-section img {
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 6px;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <nav class="app-nav">
    <a href="configurator/" class="configurator-cta">Buka Web Configurator (3D)</a>
    <a href="https://github.com/adamyaufani/vaniflight" target="_blank" rel="noopener">GitHub Repo</a>
  </nav>
  <div id="app">Memuat dokumentasi VaniFlight...</div>
  <script>
    window.$docsify = {
      name: 'VaniFlight',
      repo: '',
      basePath: './wiki/',
      homepage: 'Home.md',
      loadSidebar: '_Sidebar.md',
      subMaxLevel: 2,
      auto2top: true,
      search: {
        placeholder: 'Cari dokumentasi...',
        noData: 'Tidak ditemukan.',
        depth: 3
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>

name: Build and Deploy MkDocs Material + Web Configurator

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs Material
        run: pip install --no-cache-dir mkdocs-material

      - name: Prepare docs_build directory from wiki
        run: |
          rm -rf docs_build
          cp -r wiki docs_build
          mv docs_build/Home.md docs_build/index.md
          rm -f docs_build/_Sidebar.md
          cp CHANGELOG.md docs_build/CHANGELOG.md
          cp ROADMAP.md docs_build/ROADMAP.md
          python3 - << 'EOF'
          import pathlib, re
          repo_blob = "https://github.com/adamyaufani/vaniflight/blob/main/"
          for md in pathlib.Path("docs_build").glob("*.md"):
              text = md.read_text(encoding="utf-8")
              text = text.replace("(Home.md)", "(index.md)")
              text = re.sub(r"\(\.\./(flying_wing_fc/[^)]+)\)", rf"({repo_blob}\1)", text)
              text = re.sub(r"\(\.\./(configurator/[^)]+)\)", rf"({repo_blob}\1)", text)
              text = re.sub(r"\((flying_wing_fc/[^)]+)\)", rf"({repo_blob}\1)", text)
              md.write_text(text, encoding="utf-8")
          EOF

      - name: Build MkDocs Material site
        run: mkdocs build --site-dir site

      - name: Copy VaniFlight 3D Web Configurator into site/configurator
        run: |
          cp -r configurator site/configurator
          touch site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
